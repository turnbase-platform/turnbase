# The `default-limits` scenario's overlay: values-loadtest.yaml minus the `loadtest` profile (so every rate
# limiter is on, as `values-local` renders it) and minus the Prometheus remote-write receiver. Resources,
# replicas and heap settings are identical, so the limiters are the only difference between that run and the
# others. test/check-overlays.sh enforces this; apply with `loadtest/install.sh --default-limits`.
origins:
  platform: http://turnbase.localhost
  gameFrontendTemplate: "http://{gameId}.games.localhost"
platform:
  replicaCount: 1
  db:
    poolMaxSize: 10
  # Phase B (ADR-0020, load-testing-phase-b.md §4.4, IMP-M18-10): the HPA owns the replica count, two at rest
  # and three at most, 1.5 CPU each. Scale out fast, scale in slowly (anti-flapping, §1).
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 40
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        policies: [{ type: Pods, value: 1, periodSeconds: 30 }]
      scaleDown:
        stabilizationWindowSeconds: 120
        policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
  resources:
    requests: { cpu: "1500m", memory: 2Gi }
    limits:   { cpu: "1500m", memory: 2Gi }
  extraEnv:
    - { name: JDK_JAVA_OPTIONS, value: "-XX:MaxRAMPercentage=70 -Xlog:gc*,safepoint:stdout:utctime,uptime" }
gamehost:
  replicaCount: 1
  resources:
    requests: { cpu: "2", memory: 4Gi }
    limits:   { cpu: "2", memory: 4Gi }
  extraEnv:
    - { name: JDK_JAVA_OPTIONS, value: "-XX:MaxRAMPercentage=70" }
postgres:
  resources:
    requests: { cpu: "4", memory: 2Gi }
    limits:   { cpu: "4", memory: 2Gi }
  # pg_stat_statements for the per-statement counts of snapshot.sh, checkpoint timing for the stall hunt.
  extraArgs: ["-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_checkpoints=on"]
redis:
  resources:
    requests: { cpu: "1", memory: 512Mi }
    limits:   { cpu: "1", memory: 512Mi }
  extraArgs: []
