# Load-test overlay, applied after values-local (and the secrets file). Every value here is fixed for the
# runs of a phase (load-testing.md); the M16 items edit it only where their sections say so, and mirror
# the edit in values-default-limits.yaml (test/check-overlays.sh).
# requests == limits, so the cgroup caps are the figures reported. If the Docker Desktop VM has
# fewer than 12 CPUs, halve every cpu below and record it in the report.
origins:
  platform: http://turnbase.localhost
  gameFrontendTemplate: "http://{gameId}.games.localhost"
platform:
  replicaCount: 1
  db:
    poolMaxSize: 10
  # Phase B (ADR-0020, load-testing-phase-b.md §4.4, IMP-M18-10): the HPA owns the replica count, two at rest
  # and three at most, 1.5 CPU each. Scale out fast, scale in slowly (anti-flapping, §1).
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 40
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        policies: [{ type: Pods, value: 1, periodSeconds: 30 }]
      scaleDown:
        stabilizationWindowSeconds: 120
        policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
  resources:
    requests: { cpu: "1500m", memory: 2Gi }
    limits:   { cpu: "1500m", memory: 2Gi }
  extraEnv:
    - { name: SPRING_PROFILES_ACTIVE, value: "local,loadtest" }
    - { name: JDK_JAVA_OPTIONS, value: "-XX:MaxRAMPercentage=70 -Xlog:gc*,safepoint:stdout:utctime,uptime" }
gamehost:
  replicaCount: 1
  # Phase B (IMP-M18-13, load-testing-phase-b.md 4.4, 5.3): KEDA owns the replica count, two at rest and three at
  # most, 1 CPU each. Scale out when the sessions fill 70 % of the per-host cap or the heap passes 85 %; scale in
  # slowly, the leaving host draining first (the drain period is the host's, 30 s).
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
      scaleDown:
        stabilizationWindowSeconds: 180
        policies: [{ type: Pods, value: 1, periodSeconds: 120 }]
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits:   { cpu: "1", memory: 2Gi }
  extraEnv:
    - { name: JDK_JAVA_OPTIONS, value: "-XX:MaxRAMPercentage=70" }
postgres:
  resources:
    requests: { cpu: "4", memory: 2Gi }
    limits:   { cpu: "4", memory: 2Gi }
  # pg_stat_statements for the per-statement counts of snapshot.sh, checkpoint timing for the stall hunt.
  extraArgs: ["-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_checkpoints=on"]
redis:
  resources:
    requests: { cpu: "1", memory: 512Mi }
    limits:   { cpu: "1", memory: 512Mi }
  extraArgs: []
observability:
  prometheus:
    remoteWriteReceiver: true
